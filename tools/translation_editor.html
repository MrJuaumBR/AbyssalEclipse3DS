<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Eclipse — Translation Editor</title>
<style>
:root{color-scheme:dark;--bg:#100d1d;--panel:#1b1630;--line:#3d3560;--accent:#7db7ff;--muted:#a99fc2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1ff;font:14px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 12px 0 0}button,input,select{font:inherit;color:inherit;background:#241d3d;border:1px solid var(--line);border-radius:6px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}main{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--line);padding:16px;overflow:auto}section{padding:18px 24px;overflow:visible}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.hint,.meta{color:var(--muted);font-size:12px}.keys{display:grid;gap:5px;margin-top:12px}.key{padding:8px;border:1px solid transparent;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.key.active,.key:hover{background:var(--panel);border-color:var(--line)}.content{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,430px);gap:18px;align-items:start}.list{min-width:0}.editor{position:sticky;top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-height:calc(100vh - 110px);overflow:auto}.path{color:var(--accent);font-family:ui-monospace,monospace;font-size:12px;margin-bottom:8px;word-break:break-all}.label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}textarea{width:100%;min-height:100px;resize:vertical;background:#100d1d;color:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;font:14px ui-monospace,monospace}#status{color:#8fe3a5}.empty{color:var(--muted);padding:60px 0;text-align:center}.section-title{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px}@media(max-width:900px){.content{grid-template-columns:1fr}.editor{position:fixed;z-index:5;left:18px;right:18px;bottom:18px;top:auto;max-height:70vh;box-shadow:0 12px 50px #0008}}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:260px}}
</style></head>
<body>
<header><h1>Translation Editor</h1><input id="file" type="file" accept=".json"><button id="loadDefault">Load mock_data.json</button><button id="addLang">Add language</button><button id="export">Export mock_data.json</button><span id="status">Open tools/data/mock_data.json to begin.</span></header>
<main><aside><input id="search" placeholder="Search keys, source text, or translations" style="width:100%"><div class="hint" style="margin-top:10px">Search checks the key path, English source text, and every loaded translation. Achievement strings are grouped and searchable too.</div><div id="langs" class="keys"></div></aside><section><div class="toolbar"><select id="lang"></select><span class="meta" id="count"></span></div><div class="content"><div class="list"><div id="keys" class="keys"></div><div id="empty" class="empty">Load a mock_data.json file to start editing.</div></div><div id="editor" class="editor" style="display:none"><div id="path" class="path"></div><label class="label">English/source value</label><textarea id="source" readonly></textarea><label class="label">Selected language translation</label><textarea id="value"></textarea><button id="save">Save translation</button></div></div></section></main>
<script>
let data=null,lang='en',selected=null,entries=[];const $=id=>document.getElementById(id);
const achievementDefaults={
 ach_season_forest:['FOREST CLEAR','CONCLUSAO DA FLORESTA'],ach_season_desert:['DESERT CLEAR','CONCLUSAO DO DESERTO'],ach_season_snow:['SNOW CLEAR','CONCLUSAO DA NEVE'],ach_season_mountain:['MOUNTAIN CLEAR','CONCLUSAO DA MONTANHA'],ach_season_eclipse:['ECLIPSE CLEAR','CONCLUSAO DO ECLIPSE'],
 ach_kills_1000:['FIRST THOUSAND','PRIMEIRO MILHAR'],ach_kills_10000:['TEN THOUSAND','DEZ MIL'],ach_kills_100000:['HUNDRED THOUSAND','CEM MIL'],
 ach_catalog_forest:['FOREST CATALOG','CATALOGO DA FLORESTA'],ach_catalog_desert:['DESERT CATALOG','CATALOGO DO DESERTO'],ach_catalog_snow:['SNOW CATALOG','CATALOGO DA NEVE'],ach_catalog_mountain:['MOUNTAIN CATALOG','CATALOGO DA MONTANHA'],ach_catalog_eclipse:['ECLIPSE CATALOG','CATALOGO DO ECLIPSE'],
 ach_full_catalog:['MASTER CATALOG','CATALOGO COMPLETO'],ach_little_dummy:['LITTLE DUMMY','PEQUENO BOBO'],ach_abyss_veteran:['ABYSS VETERAN','VETERANO DO ABISMO'],ach_touch_grass:['GO TOUCH GRASS','VAI TOCAR GRAMA'],
 ach_nightwarden:['NIGHT WATCH','VIGILANTE NOTURNO'],ach_grinmask:['WHY SO SERIOUS?','POR QUE TAO SERIO?'],ach_redcap:["CRIMSON CAP",'BONE CARMESIM'],ach_arcwarden:['HEART OF IRON','CORACAO DE FERRO'],ach_elementalist:['ELEMENTALIST','ELEMENTALIST'],
 ach_season_forest_desc:['Clear the Forest season.','Conclua a temporada da Floresta.'],ach_season_desert_desc:['Clear the Desert season.','Conclua a temporada do Deserto.'],ach_season_snow_desc:['Clear the Snow season.','Conclua a temporada da Neve.'],ach_season_mountain_desc:['Clear the Mountain season.','Conclua a temporada da Montanha.'],ach_season_eclipse_desc:['Clear the Eclipse season.','Conclua a temporada do Eclipse.'],ach_kills_1000_desc:['Defeat 1,000 enemies.','Derrote 1.000 inimigos.'],ach_kills_10000_desc:['Defeat 10,000 enemies.','Derrote 10.000 inimigos.'],ach_kills_100000_desc:['Defeat 100,000 enemies.','Derrote 100.000 inimigos.'],ach_catalog_forest_desc:['Discover the Forest catalog.','Descubra o catalogo da Floresta.'],ach_catalog_desert_desc:['Discover the Desert catalog.','Descubra o catalogo do Deserto.'],ach_catalog_snow_desc:['Discover the Snow catalog.','Descubra o catalogo da Neve.'],ach_catalog_mountain_desc:['Discover the Mountain catalog.','Descubra o catalogo da Montanha.'],ach_catalog_eclipse_desc:['Discover the Eclipse catalog.','Descubra o catalogo do Eclipse.'],ach_full_catalog_desc:['Discover every spell and enemy in the game.','Descubra todas as magias e inimigos do jogo.'],ach_little_dummy_desc:['Play for at least 1 hour.','Jogue por pelo menos 1 hora.'],ach_abyss_veteran_desc:['Play for at least 10 hours.','Jogue por pelo menos 10 horas.'],ach_touch_grass_desc:['Play for at least 50 hours. Please take a break.','Jogue por pelo menos 50 horas. Faca uma pausa.'],ach_nightwarden_desc:['Play for at least 1 hour to unlock the Nightwarden outfit.','Jogue por pelo menos 1 hora para liberar a roupa Nightwarden.'],ach_grinmask_desc:['Play for at least 10 hours to unlock the Grinmask outfit.','Jogue por pelo menos 10 horas para liberar a roupa Grinmask.'],ach_redcap_desc:['Defeat 1,000 enemies to unlock the Crimson Cap outfit.','Derrote 1.000 inimigos para liberar a roupa Bone Carmesim.'],ach_arcwarden_desc:['Complete the full catalog to unlock the Arc Helmet outfit.','Complete o catalogo para liberar a roupa Capacete Arc.'],ach_elementalist_desc:['Use at least two distinct spells from each spell type.','Use pelo menos duas magias diferentes de cada tipo.']
};
function ensureAchievements(){if(!data?.LANGS)return;Object.entries(data.LANGS).forEach((table,li)=>{let d=table[1];Object.entries(achievementDefaults).forEach(([k,v])=>{if(typeof d[k]!=='string'||!d[k])d[k]=v[li===0?0:1]})})}
function walk(v,path=[],out=[]){if(typeof v==='string')out.push({path,value:v});else if(v&&typeof v==='object')Object.entries(v).forEach(([k,x])=>walk(x,path.concat(k),out));return out}
function get(obj,path){return path.reduce((v,k)=>v?.[k],obj)}function set(obj,path,value){let x=obj;path.slice(0,-1).forEach(k=>x=x[k]);x[path.at(-1)]=value}
function render(){if(!data)return;let l=data.LANGS||{};lang=$('lang').value||Object.keys(l)[0];let source=l.en||{};let current=l[lang]||{};let sourceEntries=walk(source),currentEntries=walk(current),paths=new Map();[...sourceEntries,...currentEntries].forEach(e=>paths.set(e.path.join('\u0000'),e.path));let q=$('search').value.trim().toLowerCase();entries=[...paths.values()].map(path=>({path,value:get(current,path)||'',source:get(source,path)||''})).filter(e=>{let text=[e.path.join('.'),e.source,e.value,...Object.values(l).map(t=>get(t,e.path)||'')].join(' ').toLowerCase();return !q||text.includes(q)}).sort((a,b)=>a.path.join('.').localeCompare(b.path.join('.')));$('count').textContent=`${entries.length} strings`;let list=$('keys');list.innerHTML='';entries.forEach((e,i)=>{let b=document.createElement('div');b.className='key'+(selected&&selected.path.join()==e.path.join()?' active':'');b.textContent=e.path.join('.');b.title=`${e.source||e.value}`;b.onclick=()=>select(i);list.appendChild(b)});$('empty').style.display=entries.length?'none':'block';if(selected&&entries.some(e=>e.path.join()==selected.path.join()))showSelected();else if(!entries.length)$('editor').style.display='none'}
function select(i){selected=entries[i];showSelected();render()}
function showSelected(){if(!selected||!data)return;let src=get(data.LANGS.en,selected.path)||'';let val=get(data.LANGS[lang],selected.path)||'';$('editor').style.display='block';$('path').textContent=selected.path.join(' › ');$('source').value=src;$('value').value=val;$('empty').style.display='none'}
function refreshLangs(){let l=data?.LANGS||{};$('lang').innerHTML=Object.keys(l).map(x=>`<option value="${x}">${x}</option>`).join('');$('lang').value=lang;render()}
function load(obj){data=obj;ensureAchievements();lang=Object.keys(obj.LANGS||{})[0]||'en';selected=null;refreshLangs();$('status').textContent='Loaded. Achievement strings are available in the search list.'}
$('file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch(_){alert('Invalid JSON')}};r.readAsText(e.target.files[0])};$('loadDefault').onclick=()=>{fetch('data/mock_data.json').then(r=>r.json()).then(load).catch(()=>alert('When opened from file://, choose tools/data/mock_data.json manually.'))};$('lang').onchange=()=>{lang=$('lang').value;selected=null;render()};$('search').oninput=render;$('save').onclick=()=>{if(selected){set(data.LANGS[lang],selected.path,$('value').value);selected=null;render();$('status').textContent='Saved in memory.'}};$('addLang').onclick=()=>{if(!data)return alert('Load a JSON file first.');let code=prompt('Language code (example: es):');if(!code||data.LANGS[code])return;data.LANGS[code]=JSON.parse(JSON.stringify(data.LANGS.en));lang=code;refreshLangs()};$('export').onclick=()=>{if(!data)return alert('Load a JSON file first.');let blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mock_data.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
